plugins {
    id "com.android.application"
}

def releaseVersionCode = (providers.gradleProperty("versionCode").orElse("1").get()).toInteger()
def releaseVersionName = providers.gradleProperty("versionName").orElse("1.0.0").get()

android {
    namespace "com.wonderwon.downloadery"
    compileSdk 35

    defaultConfig {
        applicationId "com.wonderwon.downloadery"
        minSdk 23
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
