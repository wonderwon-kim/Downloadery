name: Android armv7a release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Derive Android version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build armv7a release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/armeabi-v7a/release/app-armeabi-v7a-release.apk "Downloadery-${GITHUB_REF_NAME}-armv7a.apk"
          sha256sum "Downloadery-${GITHUB_REF_NAME}-armv7a.apk" > "Downloadery-${GITHUB_REF_NAME}-armv7a.apk.sha256"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Downloadery-${{ github.ref_name }}-armv7a.apk
            Downloadery-${{ github.ref_name }}-armv7a.apk.sha256
